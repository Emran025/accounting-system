name: Desktop application

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - "frontend/**"
      - "distribution/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build desktop (${{ matrix.flavor }} / ${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            flavor: client
            feature: client-product
            args: ""
            artifact: client-linux-x64
          - platform: windows-latest
            flavor: server
            feature: server-product
            args: ""
            artifact: server-windows-x64
            runtime_target: windows-x86_64
            agent_target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            flavor: server
            feature: server-product
            args: ""
            artifact: server-linux-x64
            runtime_target: linux-x86_64
            agent_target: x86_64-unknown-linux-gnu
          - platform: macos-15
            flavor: server
            feature: server-product
            args: ""
            artifact: server-macos-arm64
            runtime_target: macos-aarch64
            agent_target: aarch64-apple-darwin
          - platform: macos-15-intel
            flavor: server
            feature: server-product
            args: ""
            artifact: server-macos-x64
            runtime_target: macos-x86_64
            agent_target: x86_64-apple-darwin
          - platform: windows-latest
            flavor: client
            feature: client-product
            args: ""
            artifact: client-windows-x64
          - platform: macos-latest
            flavor: client
            feature: client-product
            args: "--target aarch64-apple-darwin"
            artifact: client-macos-arm64
          - platform: macos-latest
            flavor: client
            feature: client-product
            args: "--target x86_64-apple-darwin"
            artifact: client-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timeout --foreground 8m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo timeout --foreground 8m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify flavor-specific NSIS icons
        working-directory: frontend
        run: npm run desktop:verify-flavor-icons -- ${{ matrix.flavor }}

      - name: Test resilient Server runtime preparation policies
        if: matrix.flavor == 'server'
        working-directory: frontend
        run: >-
          node --test scripts/verified-download.test.mjs
          scripts/mariadb-runtime-policy.test.mjs

      - name: Set up PHP build tooling for Server Desktop
        if: matrix.flavor == 'server'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          extensions: fileinfo

      - name: Install production Laravel dependencies for Server Desktop
        if: matrix.flavor == 'server'
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install macOS runtime build dependencies
        if: matrix.flavor == 'server' && startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          brew update
          brew install bison byacc cmake gnutls libxml2 m4
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          developer_dir="$(xcode-select -p)"
          sdk_root="$(DEVELOPER_DIR="$developer_dir" xcrun --sdk macosx --show-sdk-path)"
          toolchain_bin="$developer_dir/Toolchains/XcodeDefault.xctoolchain/usr/bin"
          test -x "$toolchain_bin/clang"
          test -x "$toolchain_bin/clang++"
          {
            echo "DEVELOPER_DIR=$developer_dir"
            echo "SDKROOT=$sdk_root"
            echo "ACCORE_MACOS_DEVELOPER_DIR=$developer_dir"
            echo "ACCORE_MACOS_SDKROOT=$sdk_root"
            echo "CC=$toolchain_bin/clang"
            echo "CXX=$toolchain_bin/clang++"
          } >> "$GITHUB_ENV"

      - name: Lock Xcode SDK for MariaDB source build
        if: matrix.flavor == 'server' && startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          sudo xcode-select --switch "$ACCORE_MACOS_DEVELOPER_DIR"
          test "$(xcode-select -p)" = "$ACCORE_MACOS_DEVELOPER_DIR"
          printf '#include <cstddef>\n#include <cstdlib>\nint main() { return 0; }\n' |
            "$CXX" -isysroot "$ACCORE_MACOS_SDKROOT" -x c++ -std=c++17 -fsyntax-only -

      - name: Prepare verified Server Desktop runtime
        if: matrix.flavor == 'server'
        working-directory: frontend
        env:
          ACCORE_RUNTIME_DOWNLOAD_CACHE: ${{ runner.temp }}/accore-runtime-cache
        run: npm run desktop:prepare-server-runtime -- ${{ matrix.runtime_target }}

      - name: Build ACCORE Server Agent sidecar
        if: matrix.flavor == 'server'
        shell: pwsh
        run: |
          cargo build --manifest-path distribution/crates/accore-server-agent/Cargo.toml --release --target ${{ matrix.agent_target }}
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries | Out-Null
          $suffix = if ('${{ matrix.platform }}' -eq 'windows-latest') { '.exe' } else { '' }
          $source = "distribution/crates/accore-server-agent/target/${{ matrix.agent_target }}/release/accore-server-agent$suffix"
          $destination = "frontend/src-tauri/binaries/accore-server-agent-${{ matrix.agent_target }}$suffix"
          Copy-Item $source $destination

      - name: Test Server Agent decision and data-policy contracts
        if: matrix.flavor == 'server'
        shell: pwsh
        run: cargo test --manifest-path distribution/crates/accore-server-agent/Cargo.toml

      - name: Verify Server Desktop runtime package contract
        if: matrix.flavor == 'server'
        working-directory: frontend
        run: node scripts/verify-server-runtime-package.mjs

      - name: Validate Server Agent lifecycle public contract
        if: matrix.flavor == 'server' && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $agentSource = Resolve-Path 'frontend/src-tauri/binaries/accore-server-agent-x86_64-pc-windows-msvc.exe'
          $agent = Join-Path (Resolve-Path 'frontend/src-tauri') 'accore-server-agent.exe'
          $publicStatusRoot = Join-Path $env:ProgramData 'ACCORE ERP\Server Status'
          $lifecycleScript = (Resolve-Path 'distribution/tests/windows/server-lifecycle-public-contract.ps1').Path
          Copy-Item $agentSource $agent -Force
          try {
            & $lifecycleScript `
              -Agent $agent `
              -PublicStatusRoot $publicStatusRoot
          }
          finally {
            Remove-Item $agent -Force -ErrorAction SilentlyContinue
          }

      - name: Generate updater configuration for signed release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: frontend
        env:
          ACCORE_TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.ACCORE_TAURI_UPDATER_PUBLIC_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/create-tauri-updater-release-config.mjs
          ${{ matrix.flavor }}
          src-tauri/tauri.release.generated.conf.json

      - name: Build and upload desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ACCORE_PRODUCT_FLAVOR: ${{ matrix.flavor }}
          NEXT_PUBLIC_ACCORE_PRODUCT_FLAVOR: ${{ matrix.flavor }}
          NEXT_PUBLIC_ACCORE_SERVER_API_BASE: ${{ matrix.flavor == 'server' && 'http://127.0.0.1:8765/api' || '' }}
        with:
          projectPath: frontend
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.${{ matrix.flavor }}.conf.json --features ${{ matrix.feature }} ${{ matrix.args }} ${{ startsWith(github.ref, 'refs/tags/desktop-v') && '--config src-tauri/tauri.release.generated.conf.json' || '' }}
          uploadWorkflowArtifacts: false

      - name: Build and verify macOS Server Desktop PKG
        if: matrix.flavor == 'server' && startsWith(matrix.platform, 'macos-')
        working-directory: frontend
        run: npm run desktop:build-server-desktop-macos-package -- ${{ matrix.runtime_target }}

      - name: Validate macOS Server Desktop installation contract
        if: matrix.flavor == 'server' && startsWith(matrix.platform, 'macos-')
        shell: bash
        run: >-
          distribution/tests/macos/server-package-contract.sh
          --package "$(find frontend/src-tauri/target/server-desktop/${{ matrix.runtime_target }} -name '*.pkg' -type f -print -quit)"
          --product server-desktop
          --runtime-target ${{ matrix.runtime_target }}

      - name: Upload macOS Server Desktop PKG for pull request verification
        if: matrix.flavor == 'server' && startsWith(matrix.platform, 'macos-') && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: accore-${{ matrix.artifact }}-verification-package
          if-no-files-found: error
          path: frontend/src-tauri/target/server-desktop/${{ matrix.runtime_target }}/*.pkg

      - name: Upload desktop installers and updater signatures
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: actions/upload-artifact@v4
        with:
          name: accore-${{ matrix.artifact }}-assets
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/**/bundle/**/*.AppImage
            frontend/src-tauri/target/**/bundle/**/*.deb
            frontend/src-tauri/target/**/bundle/**/*.rpm
            frontend/src-tauri/target/**/bundle/**/*.msi
            frontend/src-tauri/target/**/bundle/**/*.exe
            frontend/src-tauri/target/**/bundle/**/*.dmg
            frontend/src-tauri/target/**/bundle/**/*.tar.gz
            frontend/src-tauri/target/**/bundle/**/*.sig
            frontend/src-tauri/target/server-desktop/**/*.pkg

  build-server-headless:
    name: Build server headless (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS compiler for Server Headless
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          $makeNsis = @(
            (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe')
            (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $makeNsis) { throw 'NSIS compiler installation did not provide makensis.exe' }
          "ACCORE_MAKENSIS_EXECUTABLE=$makeNsis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test resilient Server runtime preparation policies
        working-directory: frontend
        run: >-
          node --test scripts/verified-download.test.mjs
          scripts/mariadb-runtime-policy.test.mjs

      - name: Set up PHP build tooling for Server Headless
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          extensions: fileinfo

      - name: Install production Laravel dependencies for Server Headless
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare verified Server Headless runtime
        working-directory: frontend
        env:
          ACCORE_RUNTIME_DOWNLOAD_CACHE: ${{ runner.temp }}/accore-runtime-cache
        run: npm run desktop:prepare-server-runtime

      - name: Build ACCORE Server Agent for Headless package
        shell: pwsh
        run: |
          cargo build --manifest-path distribution/crates/accore-server-agent/Cargo.toml --release
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries | Out-Null
          Copy-Item distribution/crates/accore-server-agent/target/release/accore-server-agent.exe frontend/src-tauri/binaries/accore-server-agent-x86_64-pc-windows-msvc.exe

      - name: Verify Server Headless installer source contract
        working-directory: frontend
        run: npm run desktop:verify-server-headless-installer

      - name: Build Server Headless NSIS installer
        working-directory: frontend
        run: npm run desktop:build-server-headless-installer

      - name: Validate Server Headless silent installation contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'frontend/src-tauri/target/server-headless/ACCORE.ERP.Server.Headless-x86_64-setup.exe').Path
          $publicStatusRoot = Join-Path $env:ProgramData 'ACCORE ERP\Server Status'
          $contract = (Resolve-Path 'distribution/tests/windows/server-headless-silent-contract.ps1').Path
          & $contract -Installer $installer -PublicStatusRoot $publicStatusRoot

      - name: Upload Server Headless installer
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: actions/upload-artifact@v4
        with:
          name: accore-server-headless-windows-x64-assets
          if-no-files-found: error
          path: frontend/src-tauri/target/server-headless/*.exe

  build-server-headless-unix:
    name: Build server headless (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            runtime_target: linux-x86_64
            agent_target: x86_64-unknown-linux-gnu
            artifact: server-headless-linux-x64
          - platform: macos-15
            runtime_target: macos-aarch64
            agent_target: aarch64-apple-darwin
            artifact: server-headless-macos-arm64
          - platform: macos-15-intel
            runtime_target: macos-x86_64
            agent_target: x86_64-apple-darwin
            artifact: server-headless-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux package tooling
        if: matrix.platform == 'ubuntu-22.04'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install macOS runtime build dependencies
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          brew update
          brew install bison byacc cmake gnutls libxml2 m4
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          developer_dir="$(xcode-select -p)"
          sdk_root="$(DEVELOPER_DIR="$developer_dir" xcrun --sdk macosx --show-sdk-path)"
          toolchain_bin="$developer_dir/Toolchains/XcodeDefault.xctoolchain/usr/bin"
          test -x "$toolchain_bin/clang"
          test -x "$toolchain_bin/clang++"
          {
            echo "DEVELOPER_DIR=$developer_dir"
            echo "SDKROOT=$sdk_root"
            echo "ACCORE_MACOS_DEVELOPER_DIR=$developer_dir"
            echo "ACCORE_MACOS_SDKROOT=$sdk_root"
            echo "CC=$toolchain_bin/clang"
            echo "CXX=$toolchain_bin/clang++"
          } >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test resilient Server runtime preparation policies
        working-directory: frontend
        run: >-
          node --test scripts/verified-download.test.mjs
          scripts/mariadb-runtime-policy.test.mjs

      - name: Set up PHP build tooling
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          extensions: fileinfo

      - name: Install production Laravel dependencies
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Lock Xcode SDK for MariaDB source build
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          sudo xcode-select --switch "$ACCORE_MACOS_DEVELOPER_DIR"
          test "$(xcode-select -p)" = "$ACCORE_MACOS_DEVELOPER_DIR"
          printf '#include <cstddef>\n#include <cstdlib>\nint main() { return 0; }\n' |
            "$CXX" -isysroot "$ACCORE_MACOS_SDKROOT" -x c++ -std=c++17 -fsyntax-only -

      - name: Prepare verified Server Headless runtime
        working-directory: frontend
        env:
          ACCORE_RUNTIME_DOWNLOAD_CACHE: ${{ runner.temp }}/accore-runtime-cache
        run: npm run desktop:prepare-server-runtime -- ${{ matrix.runtime_target }}

      - name: Build ACCORE Server Agent sidecar
        shell: pwsh
        run: |
          cargo build --manifest-path distribution/crates/accore-server-agent/Cargo.toml --release --target ${{ matrix.agent_target }}
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries | Out-Null
          $source = "distribution/crates/accore-server-agent/target/${{ matrix.agent_target }}/release/accore-server-agent"
          Copy-Item $source "frontend/src-tauri/binaries/accore-server-agent-${{ matrix.agent_target }}"

      - name: Build native Server Headless package
        working-directory: frontend
        run: npm run desktop:build-server-headless-package -- ${{ matrix.runtime_target }}

      - name: Validate macOS Server Headless installation contract
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: >-
          distribution/tests/macos/server-package-contract.sh
          --package "$(find frontend/src-tauri/target/server-headless/${{ matrix.runtime_target }} -name '*.pkg' -type f -print -quit)"
          --product server-headless
          --runtime-target ${{ matrix.runtime_target }}

      - name: Upload macOS Server Headless PKG for pull request verification
        if: startsWith(matrix.platform, 'macos-') && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: accore-${{ matrix.artifact }}-verification-package
          if-no-files-found: error
          path: frontend/src-tauri/target/server-headless/${{ matrix.runtime_target }}/*.pkg

      - name: Upload Server Headless packages
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: actions/upload-artifact@v4
        with:
          name: accore-${{ matrix.artifact }}-assets
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/server-headless/${{ matrix.runtime_target }}/*.deb
            frontend/src-tauri/target/server-headless/${{ matrix.runtime_target }}/*.rpm
            frontend/src-tauri/target/server-headless/${{ matrix.runtime_target }}/*.pkg
            frontend/src-tauri/target/server-headless/${{ matrix.runtime_target }}/*.tar.gz

  release-desktop:
    name: Create desktop release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [build-desktop, build-server-headless, build-server-headless-unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata generator
        uses: actions/checkout@v4

      - name: Set up Node.js for manifest generation
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "accore-*-assets"
          path: release-assets

      - name: Stage publishable desktop release assets
        run: >-
          node frontend/scripts/stage-desktop-release-assets.mjs
          release-assets
          release-publish-assets

      - name: Generate signed release manifests
        env:
          ACCORE_RELEASE_TAG: ${{ github.ref_name }}
          ACCORE_SOURCE_REVISION: ${{ github.sha }}
          ACCORE_MANIFEST_KEY_ID: ${{ secrets.ACCORE_MANIFEST_KEY_ID }}
          ACCORE_MANIFEST_PRIVATE_KEY: ${{ secrets.ACCORE_MANIFEST_PRIVATE_KEY }}
          ACCORE_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: node frontend/scripts/create-release-manifests.mjs release-publish-assets release-manifests

      - name: Create GitHub release and upload installers
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ACCORE ERP Desktop Release (${{ github.ref_name }})
          generate_release_notes: true
          files: |
            release-publish-assets/**
            release-manifests/**
