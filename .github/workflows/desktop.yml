name: Desktop application

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build desktop (${{ matrix.flavor }} / ${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            flavor: client
            feature: client-product
            args: ""
            artifact: client-linux-x64
          - platform: windows-latest
            flavor: server
            feature: server-product
            args: ""
            artifact: server-windows-x64
          - platform: windows-latest
            flavor: client
            feature: client-product
            args: ""
            artifact: client-windows-x64
          - platform: macos-latest
            flavor: client
            feature: client-product
            args: "--target aarch64-apple-darwin"
            artifact: client-macos-arm64
          - platform: macos-latest
            flavor: client
            feature: client-product
            args: "--target x86_64-apple-darwin"
            artifact: client-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timeout --foreground 8m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo timeout --foreground 8m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify flavor-specific NSIS icons
        working-directory: frontend
        run: npm run desktop:verify-flavor-icons -- ${{ matrix.flavor }}

      - name: Set up PHP build tooling for Server Desktop
        if: matrix.flavor == 'server'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          extensions: fileinfo

      - name: Install production Laravel dependencies for Server Desktop
        if: matrix.flavor == 'server'
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare verified Server Desktop runtime
        if: matrix.flavor == 'server'
        working-directory: frontend
        env:
          ACCORE_RUNTIME_DOWNLOAD_CACHE: ${{ runner.temp }}/accore-runtime-cache
        run: npm run desktop:prepare-server-runtime

      - name: Build ACCORE Server Agent sidecar
        if: matrix.flavor == 'server'
        shell: pwsh
        run: |
          cargo build --manifest-path distribution/crates/accore-server-agent/Cargo.toml --release
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries | Out-Null
          Copy-Item distribution/crates/accore-server-agent/target/release/accore-server-agent.exe frontend/src-tauri/binaries/accore-server-agent-x86_64-pc-windows-msvc.exe

      - name: Smoke test self-contained Server Desktop runtime
        if: matrix.flavor == 'server'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $agentSource = Resolve-Path 'frontend/src-tauri/binaries/accore-server-agent-x86_64-pc-windows-msvc.exe'
          $agent = Join-Path (Resolve-Path 'frontend/src-tauri') 'accore-server-agent.exe'
          Copy-Item $agentSource $agent -Force
          $runtimeRoot = Resolve-Path 'frontend/src-tauri/resources/server-runtime/windows-x86_64'
          $dataRoot = Join-Path $env:ProgramData 'ACCORE ERP\Server'
          $statusPath = Join-Path $env:ProgramData 'ACCORE ERP\Server Status\runtime-status.json'
          $backupStatusPath = Join-Path $env:ProgramData 'ACCORE ERP\Server Status\backup-status.json'
          $backupManifestPath = Join-Path $dataRoot 'backups\manifest.json'
          $agentConfigPath = Join-Path $dataRoot 'agent-config.json'
          $runtimeEnv = 'frontend/src-tauri/resources/server-runtime/windows-x86_64/app/.env'
          try {
            $env:PHPRC = $runtimeRoot
            $extensionProbe = Join-Path $runtimeRoot 'accore-extension-probe.php'
            Set-Content -LiteralPath $extensionProbe -NoNewline -Value "<?php exit(extension_loaded('pdo_mysql') ? 0 : 1);"
            & (Join-Path $runtimeRoot 'frankenphp.exe') php-cli $extensionProbe
            if ($LASTEXITCODE -ne 0) { throw 'Embedded FrankenPHP did not load the required pdo_mysql extension' }
            Remove-Item $extensionProbe -Force
            New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
            Set-Content -LiteralPath (Join-Path $dataRoot 'control.backup') -NoNewline -Value "requested`n"
            & $agent install
            if ($LASTEXITCODE -ne 0) { throw "Agent installation exited with $LASTEXITCODE" }
            $deadline = (Get-Date).AddMinutes(3)
            $status = $null
            while ((Get-Date) -lt $deadline) {
              if (Test-Path $statusPath) {
                $status = Get-Content $statusPath -Raw | ConvertFrom-Json
                if ($status.state -eq 'ready') { break }
                if ($status.state -eq 'unhealthy') { throw "Server Agent reported unhealthy: $($status.detail)" }
              }
              Start-Sleep -Seconds 2
            }
            if ($null -eq $status -or $status.state -ne 'ready') { throw 'Server Agent did not become ready within three minutes' }
            if ($status.database.state -ne 'ready' -or $status.api.state -ne 'ready' -or $status.queue.state -ne 'ready') { throw 'Not every Server Desktop component reached ready state' }
            if (Test-Path $runtimeEnv) { throw 'Runtime package contains a forbidden Laravel environment file' }
            $privateAcl = Get-Acl (Join-Path $dataRoot 'agent-config.json')
            if ($privateAcl.Access.IdentityReference.Value -match 'Users') { throw 'Agent configuration grants an ordinary Users ACL entry' }
            $backupDeadline = (Get-Date).AddMinutes(5)
            $backupManifest = $null
            do {
              Start-Sleep -Seconds 2
              if (Test-Path $backupManifestPath) {
                $backupManifest = Get-Content $backupManifestPath -Raw | ConvertFrom-Json
              }
            } while (($null -eq $backupManifest -or $backupManifest.records.Count -lt 1 -or $null -eq $backupManifest.records[0].verifiedAtUnix) -and (Get-Date) -lt $backupDeadline)
            if ($null -eq $backupManifest -or $backupManifest.records.Count -lt 1) { throw 'Agent did not publish a protected backup manifest' }
            if ($backupManifest.records[0].verifiedAtUnix -eq $null) { throw 'Latest protected backup was not verified through isolated restore validation' }
            $backupArchive = Join-Path (Join-Path $dataRoot 'backups') $backupManifest.records[0].artifact
            if (-not (Test-Path $backupArchive) -or (Get-Item $backupArchive).Length -le 0) { throw 'Protected compressed backup archive is missing or empty' }
            if (-not (Test-Path $backupStatusPath)) { throw 'Agent did not publish redacted public backup status' }
          }
          catch {
            Write-Host 'Server Desktop smoke-test diagnostics follow.'
            foreach ($diagnosticPath in @($statusPath, $backupStatusPath, $backupManifestPath)) {
              if (Test-Path $diagnosticPath) {
                Write-Host "--- $diagnosticPath ---"
                Get-Content $diagnosticPath -Raw
              }
            }
            $auditPath = Join-Path $dataRoot 'operations-audit.jsonl'
            if (Test-Path $auditPath) {
              Write-Host '--- operations-audit.jsonl, last 80 lines ---'
              Get-Content $auditPath -Tail 80
            }
            $backupsPath = Join-Path $dataRoot 'backups'
            if (Test-Path $backupsPath) {
              Write-Host '--- protected backup artifact names and sizes ---'
              Get-ChildItem $backupsPath -File | Where-Object { $_.Name -notmatch '^\.' } | Select-Object Name, Length
            }
            $logsPath = Join-Path $dataRoot 'logs'
            if (Test-Path $logsPath) {
              Get-ChildItem $logsPath -File | ForEach-Object {
                Write-Host "--- $($_.Name), last 80 lines ---"
                Get-Content $_.FullName -Tail 80
              }
            }
            throw
          }
          finally {
            & $agent uninstall
            Remove-Item $agent -Force -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $env:ProgramData 'ACCORE ERP') -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Generate updater configuration for signed release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        working-directory: frontend
        env:
          ACCORE_TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.ACCORE_TAURI_UPDATER_PUBLIC_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          node scripts/create-tauri-updater-release-config.mjs
          ${{ matrix.flavor }}
          src-tauri/tauri.release.generated.conf.json

      - name: Build and upload desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ACCORE_PRODUCT_FLAVOR: ${{ matrix.flavor }}
          NEXT_PUBLIC_ACCORE_PRODUCT_FLAVOR: ${{ matrix.flavor }}
          NEXT_PUBLIC_ACCORE_SERVER_API_BASE: ${{ matrix.flavor == 'server' && 'http://127.0.0.1:8765/api' || '' }}
        with:
          projectPath: frontend
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.${{ matrix.flavor }}.conf.json --features ${{ matrix.feature }} ${{ matrix.args }} ${{ startsWith(github.ref, 'refs/tags/desktop-v') && '--config src-tauri/tauri.release.generated.conf.json' || '' }}
          uploadWorkflowArtifacts: false

      - name: Upload desktop installers and updater signatures
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: actions/upload-artifact@v4
        with:
          name: accore-${{ matrix.artifact }}-assets
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/**/bundle/**/*.AppImage
            frontend/src-tauri/target/**/bundle/**/*.deb
            frontend/src-tauri/target/**/bundle/**/*.rpm
            frontend/src-tauri/target/**/bundle/**/*.msi
            frontend/src-tauri/target/**/bundle/**/*.exe
            frontend/src-tauri/target/**/bundle/**/*.dmg
            frontend/src-tauri/target/**/bundle/**/*.tar.gz
            frontend/src-tauri/target/**/bundle/**/*.sig

  release-desktop:
    name: Create desktop release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata generator
        uses: actions/checkout@v5

      - name: Set up Node.js for manifest generation
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "accore-*-assets"
          path: release-assets

      - name: Stage publishable desktop release assets
        run: >-
          node frontend/scripts/stage-desktop-release-assets.mjs
          release-assets
          release-publish-assets

      - name: Generate signed release manifests
        env:
          ACCORE_RELEASE_TAG: ${{ github.ref_name }}
          ACCORE_SOURCE_REVISION: ${{ github.sha }}
          ACCORE_MANIFEST_KEY_ID: ${{ secrets.ACCORE_MANIFEST_KEY_ID }}
          ACCORE_MANIFEST_PRIVATE_KEY: ${{ secrets.ACCORE_MANIFEST_PRIVATE_KEY }}
          ACCORE_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: node frontend/scripts/create-release-manifests.mjs release-publish-assets release-manifests

      - name: Create GitHub release and upload installers
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ACCORE ERP Desktop Release (${{ github.ref_name }})
          generate_release_notes: true
          files: |
            release-publish-assets/**
            release-manifests/**
