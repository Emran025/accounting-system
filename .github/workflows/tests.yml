name: Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  distribution-rust-tests:
    name: Distribution Rust tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test Accore Installer Core
        working-directory: distribution/crates/accore-installer-core
        run: cargo test --locked

      - name: Test Accore API Runtime
        working-directory: distribution/crates/accore-api-runtime
        run: cargo test --locked

      - name: Test AccoreDB Runtime
        working-directory: distribution/crates/accoredb-runtime
        run: cargo test --locked

      - name: Test Accore Server Agent
        working-directory: distribution/crates/accore-server-agent
        run: cargo test --locked

  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: accore_test
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, fileinfo, mysql, intl, bcmath, curl, zip, xml
          coverage: xdebug

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
        working-directory: ./backend

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
        working-directory: ./backend

      - name: Generate Key
        run: php artisan key:generate
        working-directory: ./backend

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
        working-directory: ./backend

      - name: Execute Tests (Unit and Feature)
        run: php artisan test
        working-directory: ./backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: accore_test
          DB_USERNAME: root
          DB_PASSWORD: ""

  distribution-acceptance-certification:
    name: Distribution acceptance certification
    needs: [distribution-rust-tests, laravel-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run distribution acceptance certification
        env:
          ACCORE_ACCEPTANCE_EVIDENCE_DIR: ${{ github.workspace }}/acceptance-evidence
        run: bash distribution/scripts/run-acceptance-certification.sh

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: distribution-acceptance-${{ github.sha }}
          path: acceptance-evidence/distribution-acceptance.md
          if-no-files-found: error
