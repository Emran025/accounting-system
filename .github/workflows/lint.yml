name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # - name: Setup PHP
      #   uses: shivammathur/setup-php@v2
      #   with:
      #     php-version: '8.4'

      # - name: Install Laravel Dependencies
      #   working-directory: ./src
      #   run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # - name: Run Pint
      #   working-directory: ./src
      #   run: vendor/bin/pint

      - name: Format Frontend
        working-directory: ./frontend
        run: npm run format

      # The existing codebase has legacy lint findings. Keep the report visible
      # while tests and production build remain the blocking quality gates.
      - name: Lint Frontend (advisory)
        continue-on-error: true
        working-directory: ./frontend
        run: npm run lint

      - name: Test Frontend
        working-directory: ./frontend
        run: npm run test

      - name: Verify Localized Interface Text
        working-directory: ./frontend
        run: npm run i18n:check

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v5
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
