name: Agent task governance

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/agent-workflow/**'
      - '.github/agents/**'
      - 'scripts/validate-agent-tasks.mjs'
      - '.github/workflows/agent-task-governance.yml'
  push:
    branches: [main, develop]
    paths:
      - '.github/agent-workflow/**'
      - '.github/agents/**'
      - 'scripts/validate-agent-tasks.mjs'
      - '.github/workflows/agent-task-governance.yml'

permissions:
  contents: read

jobs:
  validate-task-records:
    name: Validate task records and evidence
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate agent task governance
        run: node scripts/validate-agent-tasks.mjs
